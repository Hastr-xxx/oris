<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .temp { font-size: 20px; }
        .town { color: #6c5ce7; font-size: 18px; }

        .first-block {
            text-align: right;
            position: absolute;
            top: 25px;
            right: 23px;
            padding: 0 20px;
        }

        .cen {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .time {
            text-align: center;
            font-size: 64px;
            margin-bottom: 8px;
        }

        .greeting {
            text-align: center;
            color: #6c5ce7;
            font-size: 27px;
            margin-bottom: 50px;
        }

        .content-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .search-form {
            width: 100%;
            margin: 0;        
        }

        .search-input {
            width: 100%;       
            padding: 14px 20px;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            background-color: #f7f7f7;
            font-family: inherit;
            font-size: 15px;
        }

        .shortcuts {
            width: 100%;      
            display: flex;
            justify-content: space-between; 
            flex-wrap: wrap;
            
        }

        .shortcut-item {
            width: 48px;
            height: 48px;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            text-decoration: none;
            background-color: #f7f7f7;
            flex-shrink: 0;
        }

        .icon-yt { color: #ff0000; }
        .icon-gpt { color: #10a37f; }
        .icon-gt { color: #4285f4; }
        .icon-discord { color: #5865f2; }
        .icon-github { color: #24292f; }
        .icon-linkedin { color: #0a66c2; }
        .icon-add { color: #a0a0a0; font-size: 18px; }

        @media (max-width: 768px) {
            .first-block { top: 16px; right: 16px; padding: 0 10px; }
            .temp { font-size: 15px; }
            .town { font-size: 13px; }

            .time { font-size: 48px; }
            .greeting { font-size: 22px; margin-bottom: 24px; }

            .content-wrapper {
                max-width: 100%; 
                gap: 24px;      
            }

           
            .shortcuts {
                justify-content: center;
                gap: 12px;
            }

            .shortcut-item {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<div class="first-block">
    <div class="temp">36°</div>
    <div class="town">Ahmedabad</div>
</div>

<div class="cen">
    <div class="time">09:11:01</div>
    <div class="greeting">Good Morning, Saad.</div>

    <div class="content-wrapper">
        
        <form method="get" action="/search" class="search-form">
            <input type="search" class="search-input" name="q" placeholder="Search" required>
        </form>

        <div class="shortcuts">
            <a href="#" class="shortcut-item"><i class="fab fa-youtube icon-yt"></i></a>
            <a href="#" class="shortcut-item"><i class="fas fa-robot icon-gpt"></i></a>
            <a href="#" class="shortcut-item"><i class="fas fa-language icon-gt"></i></a>
            <a href="#" class="shortcut-item"><i class="fab fa-discord icon-discord"></i></a>
            <a href="#" class="shortcut-item"><i class="fab fa-github icon-github"></i></a>
            <a href="#" class="shortcut-item"><i class="fab fa-linkedin-in icon-linkedin"></i></a>
            <a href="#" class="shortcut-item"><i class="fas fa-plus icon-add"></i></a>
        </div>
    </div>
</div>

</body>
</html>
